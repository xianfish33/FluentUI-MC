plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

// 独立测试源集：DevGallery 展示页与手工核对用，不进 src/test，也不走 gametest（那是给 CI 冒烟测试用的自动化源集）。
// 目录走 Gradle 默认约定 src/testmod/{java,resources}，无需显式 srcDir。
// 类路径与依赖继承在 loom 块之后接线——split 源集（client）要等 loom 的 splitEnvironmentSourceSets() 执行完才存在。
sourceSets {
	testmod
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"fluentui" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		// DevGallery 测试源集。分组后 dev 运行时资源（fabric.mod.json 等）才会被正确加载。
		"fluentui-testmod" {
			sourceSet sourceSets.testmod
		}
	}
}

// testmod 的接线按 Loom configureSourceSet 的 dependsOn 口径：
// output 加进 Compile/RuntimeClasspath，并把 main/client 的 CompileClasspath/RuntimeClasspath 配置继承过来
// （MC 与映射类都在CompileClasspath 配置里，从 implementation 继承接不到）。
configurations {
	testmodCompileClasspath.extendsFrom compileClasspath, clientCompileClasspath
	testmodRuntimeClasspath.extendsFrom runtimeClasspath, clientRuntimeClasspath
}
sourceSets.testmod {
	compileClasspath += sourceSets.main.output
	compileClasspath += sourceSets.client.output
	runtimeClasspath += sourceSets.main.output
	runtimeClasspath += sourceSets.client.output
}
// 反方向也要接：runClient / IDE「Minecraft Client」debug 的启动类路径取的是 client 源集的 runtimeClasspath，
// 不把 testmod 输出挂上去的话 dev 运行时 loader 扫不到 fluentui-testmod 的 fabric.mod.json，
// testmod 模组整个不加载——入口按键/翻译全都无声无息地没注册（只影响 dev 运行，不进 jar）。
sourceSets.client {
	runtimeClasspath += sourceSets.testmod.output
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java

			// 本库同时支持多个 Minecraft 版本，编译基线固定在支持范围里最低的 26.1。
			// 不把 loader / fabric-api 的版本通过 POM 传递给下游。
			pom.withXml {
				def mcCoupled = { String g, String a ->
					(g == 'net.fabricmc' && a == 'fabric-loader') ||
					(g == 'net.fabricmc.fabric-api' && a == 'fabric-api')
				}
				asNode().dependencies.dependency.findAll {
					mcCoupled(it.groupId.text(), it.artifactId.text())
				}.each {
					it.appendNode('optional', 'true')
				}
			}
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		maven {
			name = "github"
			url = uri("https://maven.pkg.github.com/xianfish33/FluentUI-MC")
			allowInsecureProtocol = true
			credentials {
				username = "xianfish33"
				password = System.getenv('GITHUB_PACKAGE_TOKEN')
			}
		}
		maven {
			name = "Gitea"
			url = uri("http://192.168.3.30:8418/api/packages/xianfish/maven")
			allowInsecureProtocol = true
			credentials {
				username = "xianfish"
				password = "65a482336033018033f999df6fc47e0e263cac61"
			}
		}
	}
}
